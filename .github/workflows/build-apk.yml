name: Build & Upload Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment
        run: |
          # Create .env if missing for secrets plugin
          touch .env
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

          # Ensure debug.keystore exists (restore from base64 if present, else create standard debug key)
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          if ./gradlew tasks --all | grep -q "assembleDemoDebug"; then
            echo "Building assembleDemoDebug..."
            ./gradlew assembleDemoDebug --no-daemon --stacktrace
          else
            echo "Building assembleDebug..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare APK Artifact
        run: |
          mkdir -p release_apks

          echo "=== Searching for generated APKs ==="
          find . -type f -name "*.apk" || true

          # Locate application APK (prefer demo-debug, then debug, excluding test APKs)
          APK_FILE=$(find . -type f -name "*demo*debug*.apk" ! -name "*androidTest*.apk" ! -name "*Test*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*debug*.apk" ! -name "*androidTest*.apk" ! -name "*Test*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*.apk" ! -name "*androidTest*.apk" ! -name "*Test*.apk" | head -n 1)
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" release_apks/HisabPro-debug.apk
            echo "Copied to release_apks/HisabPro-debug.apk successfully."
            ls -lh release_apks/
          else
            echo "ERROR: No APK generated! Inspecting build directory structure:"
            find . -maxdepth 5 -type d \( -name "outputs" -o -name "apk" -o -name "build" \) || true
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisabPro-debug-apk
          path: release_apks/HisabPro-debug.apk
          retention-days: 30
