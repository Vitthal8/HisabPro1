name: Build & Upload Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 & 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            21
            17

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment
        run: |
          # Create .env if missing for secrets plugin
          touch .env
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

          # Ensure debug.keystore exists (restore from base64 if present, else create standard debug key)
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure keystore is accessible in ~/.android and module directories
          mkdir -p ~/.android
          cp -f debug.keystore ~/.android/debug.keystore || true
          if [ -d app ]; then
            cp -f debug.keystore app/debug.keystore || true
          fi

      - name: Build Debug APK
        run: |
          echo "=== Determining best assemble task ==="
          if ./gradlew help --task :app:assembleDemoDebug > /dev/null 2>&1; then
            BUILD_TASK=":app:assembleDemoDebug"
          elif ./gradlew help --task assembleDemoDebug > /dev/null 2>&1; then
            BUILD_TASK="assembleDemoDebug"
          elif ./gradlew help --task :app:assembleDebug > /dev/null 2>&1; then
            BUILD_TASK=":app:assembleDebug"
          elif ./gradlew help --task assembleDebug > /dev/null 2>&1; then
            BUILD_TASK="assembleDebug"
          else
            BUILD_TASK="assemble"
          fi

          echo "Selected build task: $BUILD_TASK"
          echo "=== Executing Gradle Build ==="
          ./gradlew $BUILD_TASK --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release_apks

          echo "=== Searching for generated APKs ==="
          find . -type f -name "*.apk" || true

          # Locate application APK (prefer demo-debug, then debug, excluding test APKs)
          APK_FILE=$(find . -type f -name "*demo*debug*.apk" ! -name "*androidTest*.apk" ! -name "*Test*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*debug*.apk" ! -name "*androidTest*.apk" ! -name "*Test*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*.apk" ! -name "*androidTest*.apk" ! -name "*Test*.apk" | head -n 1)
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" release_apks/HisabPro-debug.apk
            echo "Copied to release_apks/HisabPro-debug.apk successfully."
            ls -lh release_apks/
          else
            echo "ERROR: No APK generated! Dumping project structure for diagnostics:"
            echo "=== Gradle projects ==="
            ./gradlew projects || true
            echo "=== All directory contents ==="
            find . -maxdepth 4 -not -path '*/.*' || true
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisabPro-debug-apk
          path: release_apks/HisabPro-debug.apk
          retention-days: 30
