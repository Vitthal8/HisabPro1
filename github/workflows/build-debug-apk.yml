name: Build Debug APK

# ─────────────────────────────────────────────
# WHEN DOES THIS RUN?
# ─────────────────────────────────────────────
on:
  push:
    branches:
      - main        # every push to main builds a fresh APK
      - develop     # optional: also build on develop branch
  pull_request:
    branches:
      - main        # builds on PRs so you can test before merging
  workflow_dispatch: # lets you trigger a build manually from GitHub UI

# ─────────────────────────────────────────────
# BUILD JOB
# ─────────────────────────────────────────────
jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest   # GitHub's free Linux runner

    steps:

      # 1. Check out your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java 17 (required for modern Android Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle          # caches ~/.gradle so builds are faster

      # 3. Make gradlew executable (important on Linux)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Cache Gradle dependencies (speeds up every build after the first)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Build the debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. Upload the APK as a downloadable artifact
      #    Go to: GitHub → Actions → your workflow run → Artifacts section
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HisabPro-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14    # artifact stays available for 14 days
