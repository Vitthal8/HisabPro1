name: Build & Upload Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 & 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore and Environment
        run: |
          # Copy repository CI gradle.properties if provided
          if [ -f .github/ci-gradle.properties ]; then
            echo "Applying repository .github/ci-gradle.properties..."
            mkdir -p ~/.gradle
            cp -f .github/ci-gradle.properties ~/.gradle/gradle.properties
          fi

          # Create .env if missing for secrets plugin
          touch .env
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

          # Ensure debug.keystore exists (restore from base64 if present, else create standard debug key)
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure keystore is accessible in ~/.android and module directories
          mkdir -p ~/.android
          cp -f debug.keystore ~/.android/debug.keystore || true
          if [ -d app ]; then
            cp -f debug.keystore app/debug.keystore || true
          fi

      - name: Build Debug APK
        run: |
          # Determine the appropriate assemble task based on project configuration
          TARGET_TASK=""
          if grep -rq "demo" app/build.gradle* 2>/dev/null; then
            echo "Detected 'demo' product flavor in app module."
            TARGET_TASK=":app:assembleDemoDebug"
          elif [ -d "app" ]; then
            echo "Detected standard app module."
            TARGET_TASK=":app:assembleDebug"
          else
            echo "Standard root project layout."
            TARGET_TASK="assembleDebug"
          fi

          echo "Selected primary target task: $TARGET_TASK"
          echo "=== Executing Gradle Build ==="
          if ./gradlew $TARGET_TASK --no-daemon --stacktrace; then
            echo "Successfully built with $TARGET_TASK"
          elif [ "$TARGET_TASK" = ":app:assembleDemoDebug" ] && ./gradlew assembleDemoDebug --no-daemon --stacktrace; then
            echo "Successfully built with assembleDemoDebug"
          elif ./gradlew :app:assembleDebug --no-daemon --stacktrace; then
            echo "Successfully built with :app:assembleDebug"
          elif ./gradlew assembleDebug --no-daemon --stacktrace; then
            echo "Successfully built with assembleDebug"
          else
            echo "Attempting fallback assemble..."
            ./gradlew assemble --no-daemon --stacktrace
          fi

      - name: Prepare APK Artifact
        run: |
          mkdir -p release_apks

          echo "=== Searching for generated APKs ==="
          find . -type f -name "*.apk" -ls || true

          # Locate application APK (prefer demo-debug, then debug, excluding test APKs)
          APK_FILE=$(find . -type f -name "*demo*debug*.apk" ! -name "*androidTest*.apk" ! -name "*Test*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*debug*.apk" ! -name "*androidTest*.apk" ! -name "*Test*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*.apk" ! -name "*androidTest*.apk" ! -name "*Test*.apk" | head -n 1)
          fi

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK at: $APK_FILE"
            APK_BASENAME=$(basename "$APK_FILE")
            cp "$APK_FILE" "release_apks/$APK_BASENAME"
            cp "$APK_FILE" "release_apks/HisabPro-debug.apk"
            echo "Copied APK to release_apks/ successfully:"
            ls -lh release_apks/
          else
            echo "ERROR: No APK generated! Listing outputs directory for diagnostics:"
            find . -maxdepth 6 \( -path "*/build/outputs/*" -o -name "outputs" \) || true
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HisabPro-debug-apk
          path: release_apks/
          retention-days: 30
